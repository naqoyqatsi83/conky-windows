name: Build Windows Installer

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-git
            mingw-w64-x86_64-gperf
            patch

      - name: CMake Configure
        shell: msys2 {0}
        run: |
          # NVML re-enabled: nvml.dll is now resolved dynamically at runtime
          # (src/data/hardware/nvidia_nvml.cc, via LoadLibraryA/
          # GetProcAddress against the nvml_headers-only CMake target) rather
          # than linked as a hard, eager PE import. This run's "Run tests"
          # step is the real regression check — it executes test-conky.exe
          # (same conky_core) on this GPU-less runner, which previously
          # failed to even start when nvml.dll was a hard dependency. See
          # issue #4.
          cmake -B build -G "MinGW Makefiles" \
            -DBUILD_NVIDIA_NVML=ON \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS="-static-libgcc -static-libstdc++" \
            -DCMAKE_C_FLAGS="-static-libgcc -static-libstdc++" \
            -DLUA_INCLUDE_DIR=/mingw64/include \
            -DLUA_LIBRARY=/mingw64/lib/liblua.dll.a \
            -DBUILD_MPD=OFF -DBUILD_MOC=OFF -DBUILD_CMUS=OFF -DBUILD_APCUPSD=OFF

      - name: Pre-generate config headers (workaround MSYS2 rsp path issue)
        shell: msys2 {0}
        run: |
          # Generate defconfig.h and convertconf.h into build/ (which is always in
          # the compiler include path) to work around MSYS2 CMake path formatting
          # differences in response files.
          sh bin/text2c.sh data/conky_no_x11.conf build/defconfig.h defconfig
          sh bin/text2c.sh extras/convert.lua build/convertconf.h convertconf

      - name: Build
        shell: msys2 {0}
        run: |
          mingw32-make.exe -j$(nproc) -C build 2>&1

      - name: Bundle runtime DLLs
        if: success()
        shell: msys2 {0}
        run: |
          # Copy all MinGW DLLs an exe depends on next to it (two passes:
          # direct deps, then transitive deps of whatever got copied).
          # Applied to both build/src (conky.exe, shipped in the installer)
          # and build/tests (test-conky.exe, needed to actually run it in
          # CI — see tests/CMakeLists.txt for why catch_discover_tests()
          # can't run it in-place during the build).
          bundle_dlls() {
            local dir="$1" exe="$2"
            echo "=== Direct MinGW dependencies of $exe ==="
            for dll in $(objdump -p "$dir/$exe" | grep "DLL Name" | awk '{print $NF}'); do
              if [ -f "/mingw64/bin/$dll" ]; then
                echo "  $dll"
                cp "/mingw64/bin/$dll" "$dir/"
              fi
            done
            echo "=== Transitive MinGW dependencies ==="
            for f in "$dir"/*.dll; do
              [ -f "$f" ] || continue
              for dll in $(objdump -p "$f" 2>/dev/null | grep "DLL Name" | awk '{print $NF}'); do
                if [ -f "/mingw64/bin/$dll" ] && [ ! -f "$dir/$dll" ]; then
                  echo "  $dll (via $(basename "$f"))"
                  cp "/mingw64/bin/$dll" "$dir/"
                fi
              done
            done
            echo "=== DLLs in $dir ==="
            ls -la "$dir"/*.dll 2>/dev/null || echo "(no DLLs)"
          }

          bundle_dlls build/src conky.exe
          bundle_dlls build/tests test-conky.exe

          # Real Cairo (vendored, see 3rdparty/cairo) isn't a MinGW runtime
          # DLL so bundle_dlls' objdump-based dependency walk never finds
          # it -- conky.exe doesn't even link it (src/output/
          # cairo_dynamic.cc resolves it via LoadLibraryA at runtime, see
          # conky-windows issue #10), so there's no import to discover.
          # Needed next to conky.exe for its Lua-draw-hook support to work
          # at all; harmless if a theme never uses it.
          cp 3rdparty/cairo/lib/cairo.dll build/src/

          # The Lua-loadable "cairo" module (require('cairo'), built from
          # lua/cairo.pkg) goes in lua_modules/ next to conky.exe --
          # src/lua/llua.cc's package.cpath setup looks for it there at
          # runtime. Kept separate from the real cairo.dll above so the two
          # same-named-but-different DLLs (the C library vs. the Lua module)
          # can't collide -- see conky-windows issue #10.
          mkdir -p build/src/lua_modules
          cp build/lua/libcairo.dll build/src/lua_modules/

          # curl (vendored, see 3rdparty/curl) is a real hard PE import of
          # conky.exe (src/data/network/ccurl_thread.cc, common.cc's
          # ${stock}/${github_notifications}) -- unlike cairo.dll above,
          # bundle_dlls' objdump walk DOES see it as a direct dependency,
          # but only copies DLLs that already exist under /mingw64/bin, so
          # it silently skips this one since it's vendored in-repo instead.
          # Needed next to both conky.exe and test-conky.exe (the latter
          # links conky_core, which includes ccurl_thread.cc) or both fail
          # to start at all. See conky-windows issue #18.
          cp 3rdparty/curl/lib/libcurl-x64.dll build/src/
          cp 3rdparty/curl/lib/libcurl-x64.dll build/tests/

          echo "=== Files in build/src ==="
          ls -la build/src/

      - name: Run tests
        if: success()
        shell: msys2 {0}
        run: |
          ./build/tests/test-conky.exe --reporter console

      - name: Check build output
        if: success()
        shell: pwsh
        run: |
          Get-ChildItem "build\src\conky.exe" -ErrorAction Stop
          Get-ChildItem "build\src\*.dll" 2>&1 | ForEach-Object { Write-Output $_ }
          if (-not (Get-ChildItem "build\src\*.dll" -ErrorAction SilentlyContinue)) {
            Write-Warning "No DLLs found in build\src — conky may have all deps statically linked"
          }

      - name: Download LibreHardwareMonitor
        if: success()
        shell: pwsh
        run: |
          $url = "https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/releases/download/v0.9.6/LibreHardwareMonitor.zip"
          $zip = "$env:TEMP\LHM.zip"
          $extract = "installer\LibreHardwareMonitor"
          New-Item -ItemType Directory -Force -Path $extract
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $url -OutFile $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, (Resolve-Path $extract))

      - name: Compile lhm-temp.exe
        if: success()
        shell: pwsh
        run: |
          .\installer\build_lhm_temp.ps1

      - name: Check lhm-temp.exe freshness
        if: success()
        shell: pwsh
        run: |
          # Guards against exactly the bug found 2026-09-15: setup.iss bundles
          # installer/LibreHardwareMonitor/lhm-temp.exe (a gitignored build
          # artifact) as-is with no freshness check of its own, and a stale
          # local compile silently produced no GPU sensor data with zero
          # visible errors anywhere. In CI this should always pass (the
          # previous step just rebuilt it), but it's cheap insurance and
          # documents the invariant — this exact script is also the one to
          # run locally before a manual installer build. See issue #2.
          .\installer\check_lhm_freshness.ps1

      - name: Setup Inno Setup
        if: success()
        shell: pwsh
        run: |
          choco install innosetup --no-progress --confirm

      - name: Build Installer
        if: success()
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          }
          Write-Output "Using ISCC: $iscc"
          & $iscc installer\setup.iss

      - name: Upload Installer Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Conky-Installer
          path: installer\Conky-*-Setup.exe

      - name: Install built installer (silent, with LHM task)
        if: success()
        timeout-minutes: 5
        shell: pwsh
        run: |
          # Installer-integration regression test for issue #2: actually run
          # the built installer and verify the ConkyTempHelper scheduled
          # task it creates is well-formed, rather than only ever checking
          # that conky.exe exists. This is the exact class of bug fixed in
          # d8ee2dec (schtasks /TR quoting) — that bug only ever showed up
          # by actually running the installer and inspecting the resulting
          # task, never by anything CI checked before.
          #
          # See installer/run_elevated.ps1 for why this doesn't just
          # Start-Process the installer directly (PrivilegesRequired=admin
          # hangs forever on a UAC prompt with no one to click it —
          # confirmed the hard way, a first attempt sat for 47 minutes
          # before being cancelled) and why it doesn't build the scheduled
          # task via schtasks' /TR string parameter either (unreliable
          # PowerShell native-argument quoting, confirmed locally).
          # timeout-minutes above is a hard backstop in case this ever
          # hangs for some other reason — if the CI job's own process turns
          # out not to be elevated enough to create a HighestAvailable task,
          # this fails fast (schtasks "Access is denied") rather than
          # hanging, and that's the answer to the open question noted in
          # run_elevated.ps1.
          $installer = Get-ChildItem "installer\Conky-*-Setup.exe" | Select-Object -First 1
          Write-Output "Installer: $($installer.FullName)"
          $installLog = "$env:TEMP\conky-install.log"
          .\installer\run_elevated.ps1 -ExePath $installer.FullName `
            -Arguments "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /MERGETASKS=install_lhm /LOG=`"$installLog`"" `
            -WaitForPath "C:\Program Files\Conky\conky.exe"
          Get-ChildItem "C:\Program Files\Conky" -Recurse
          Write-Output "=== Install log ($installLog) ==="
          if (Test-Path $installLog) { Get-Content $installLog } else { Write-Output "(no log file produced)" }

      - name: Verify ConkyTempHelper scheduled task
        if: success()
        timeout-minutes: 2
        shell: pwsh
        run: |
          .\tests\windows\verify_scheduled_task.ps1 `
            -ExpectedExePath "C:\Program Files\Conky\LibreHardwareMonitor\lhm-temp.exe"

      - name: Uninstall (cleanup)
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: |
          # Same UAC-hang problem and same fix as the install step above —
          # Inno Setup uninstallers inherit PrivilegesRequired from the
          # installer that generated them.
          #
          # Waits for conky.exe specifically to disappear, not the whole
          # install directory: Inno Setup uninstallers commonly can't
          # remove their own directory synchronously (unins000.exe can't
          # delete the folder it's actively running from) and leave an
          # empty/near-empty directory behind even on a fully successful
          # uninstall — that's normal, not a bug.
          $uninst = "C:\Program Files\Conky\unins000.exe"
          if (-not (Test-Path $uninst)) {
            Write-Output "No uninstaller found at $uninst — nothing to clean up."
            exit 0
          }
          .\installer\run_elevated.ps1 -ExePath $uninst `
            -Arguments "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" `
            -WaitWhilePathExists "C:\Program Files\Conky\conky.exe"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer\Conky-*-Setup.exe
          generate_release_notes: true
