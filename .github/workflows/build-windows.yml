name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-git
            mingw-w64-x86_64-gperf

      - name: CMake Configure
        shell: msys2 {0}
        run: |
          cmake -B build -G "MinGW Makefiles" -DBUILD_NVIDIA_NVML=ON \
            -DLUA_INCLUDE_DIR=/mingw64/include \
            -DLUA_LIBRARY=/mingw64/lib/liblua.dll.a

      - name: Pre-build
        shell: msys2 {0}
        run: |
          # Generate defconfig.h manually so it exists before the build
          mkdir -p build/data
          sh bin/text2c.sh data/conky_no_x11.conf build/data/defconfig.h defconfig
          sh bin/text2c.sh extras/convert.lua build/data/convertconf.h convertconf
          echo "--- Verify ---"
          ls -la build/data/defconfig.h build/data/convertconf.h 2>/dev/null

      - name: Build
        shell: msys2 {0}
        run: |
          mingw32-make.exe -j$(nproc) -C build
