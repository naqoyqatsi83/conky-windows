name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-git
            mingw-w64-x86_64-gperf

      - name: CMake Configure
        shell: msys2 {0}
        run: |
          cmake -B build -G "MinGW Makefiles" -DBUILD_NVIDIA_NVML=ON \
            -DLUA_INCLUDE_DIR=/mingw64/include \
            -DLUA_LIBRARY=/mingw64/lib/liblua.dll.a

      - name: Diagnose
        shell: msys2 {0}
        run: |
          echo "=== defconfig.h ==="
          find build -name "defconfig.h" 2>/dev/null
          echo "=== Include rsp ==="
          cat build/src/CMakeFiles/conky.dir/includes_CXX.rsp 2>/dev/null || echo "No rsp"

      - name: Build
        shell: msys2 {0}
        run: |
          mingw32-make.exe -j$(nproc) -C build
