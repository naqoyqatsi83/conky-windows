name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-git
            mingw-w64-x86_64-gperf

      - name: CMake Configure
        shell: msys2 {0}
        run: |
          cmake -B build -G "MinGW Makefiles" \
            -DBUILD_NVIDIA_NVML=ON \
            -DCMAKE_CXX_FLAGS="-static-libgcc -static-libstdc++" \
            -DCMAKE_C_FLAGS="-static-libgcc -static-libstdc++" \
            -DLUA_INCLUDE_DIR=/mingw64/include \
            -DLUA_LIBRARY=/mingw64/lib/liblua.dll.a \
            -DBUILD_MPD=OFF -DBUILD_MOC=OFF -DBUILD_CMUS=OFF -DBUILD_APCUPSD=OFF

      - name: Pre-generate config headers (workaround MSYS2 rsp path issue)
        shell: msys2 {0}
        run: |
          # Generate defconfig.h and convertconf.h into build/ (which is always in
          # the compiler include path) to work around MSYS2 CMake path formatting
          # differences in response files.
          sh bin/text2c.sh data/conky_no_x11.conf build/defconfig.h defconfig
          sh bin/text2c.sh extras/convert.lua build/convertconf.h convertconf

      - name: Build
        shell: msys2 {0}
        run: |
          mingw32-make.exe -j$(nproc) -C build 2>&1

      - name: Bundle runtime DLLs
        if: success()
        shell: msys2 {0}
        run: |
          # Resolve full transitive DLL dependency tree of conky.exe.
          # With -static-libgcc -static-libstdc++, GCC runtime is embedded in conky.exe,
          # but Lua DLL and winpthread may still be dynamic deps.
          copy_deps() {
            local exe="$1" dest="$2" pending="$3" done="$4"
            while [ -s "$pending" ]; do
              local dll
              dll="$(head -1 "$pending")"
              sed -i '1d' "$pending"
              if grep -qxF "$dll" "$done"; then continue; fi
              echo "$dll" >> "$done"
              local found
              found=$(find /mingw64/bin -maxdepth 1 -name "$dll" -type f 2>/dev/null | head -1)
              if [ -z "$found" ]; then
                # Check Windows system directory
                found=$(find /c/Windows/System32 -maxdepth 1 -name "$dll" -type f 2>/dev/null | head -1)
              fi
              if [ -n "$found" ]; then
                cp -v "$found" "$dest/"
                # Recurse: find what THIS dll depends on
                objdump -p "$found" 2>/dev/null | grep "DLL Name" | awk '{print $NF}' | \
                  while IFS= read -r dep; do
                    # Skip Windows system DLLs
                    case "$dep" in
                      KERNEL32.dll|USER32.dll|GDI32.dll|ADVAPI32.dll|SHELL32.dll|OLE32.dll|OLEAUT32.dll|COMCTL32.dll|COMDLG32.dll|WS2_32.dll|WINMM.dll|IMM32.dll|MSVCRT.dll|UxTheme.dll|DWMAPI.dll|SHLWAPI.dll|WININET.dll|MSWSOCK.dll|IPHLPAPI.dll|PSAPI.dll|WTSAPI32.dll|POWRPROF.dll|SETUPAPI.dll|CRYPT32.dll|BCRYPT.dll|Secur32.dll|NETAPI32.dll|NORMALIZ.dll|NTDLL.dll|WINTRUST.dll|WLDAP32.dll|RASAPI32.dll|RASDLG.dll|MPR.dll|VERSION.dll|CFGMGR32.dll|DEVRTL.dll|DNSAPI.dll|DNSRSLVR.dll|FWPUCLNT.dll)
                        ;;
                      libgcc_s_seh-1.dll|libstdc++-6.dll)
                        # Statically linked — should not appear, but skip just in case
                        ;;
                      *)
                        echo "$dep" >> "$pending"
                        ;;
                    esac
                  done
              fi
            done
          }
          # Bootstrap: list of DLLs conky.exe directly depends on
          mkdir -p build/src
          objdump -p build/src/conky.exe | grep "DLL Name" | awk '{print $NF}' > /tmp/dep_pending.txt
          : > /tmp/dep_done.txt
          echo "=== conky.exe direct dependencies ==="
          cat /tmp/dep_pending.txt
          echo "=== Resolving transitive deps ==="
          copy_deps build/src/conky.exe build/src /tmp/dep_pending.txt /tmp/dep_done.txt
          echo "=== DLLs in build/src ==="
          ls -la build/src/*.dll 2>/dev/null || echo "(no DLLs)"
          echo "=== Files in build/src ==="
          ls -la build/src/

      - name: Check build output
        if: success()
        shell: pwsh
        run: |
          Get-ChildItem "build\src\conky.exe" -ErrorAction Stop
          Get-ChildItem "build\src\*.dll" 2>&1 | ForEach-Object { Write-Output $_ }
          if (-not (Get-ChildItem "build\src\*.dll" -ErrorAction SilentlyContinue)) {
            Write-Warning "No DLLs found in build\src — conky may have all deps statically linked"
          }

      - name: Download LibreHardwareMonitor
        if: success()
        shell: pwsh
        run: |
          $url = "https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/releases/download/v0.9.6/LibreHardwareMonitor.zip"
          $zip = "$env:TEMP\LHM.zip"
          $extract = "installer\LibreHardwareMonitor"
          New-Item -ItemType Directory -Force -Path $extract
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $url -OutFile $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, (Resolve-Path $extract))

      - name: Compile lhm-temp.exe
        if: success()
        shell: pwsh
        run: |
          $csc = "$env:windir\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $ref = (Resolve-Path "installer\LibreHardwareMonitor\LibreHardwareMonitorLib.dll").Path
          Write-Output "Compiler: $csc"
          Write-Output "Reference: $ref"
          # Verify the DLL has the Computer type
          Add-Type -Path $ref
          Write-Output "Computer type found: $([type]::GetType('LibreHardwareMonitor.Hardware.Computer, LibreHardwareMonitorLib', $false))"
          & $csc -nologo -target:winexe `
            -reference:"$ref" `
            -out:"installer\LibreHardwareMonitor\lhm-temp.exe" `
            "installer\lhm-temp\lhm-temp.cs"

      - name: Setup Inno Setup
        if: success()
        shell: pwsh
        run: |
          choco install innosetup --no-progress --confirm

      - name: Build Installer
        if: success()
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          }
          Write-Output "Using ISCC: $iscc"
          & $iscc installer\setup.iss

      - name: Upload Installer Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Conky-Installer
          path: installer\Conky-*-Setup.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer\Conky-*-Setup.exe
          generate_release_notes: true
